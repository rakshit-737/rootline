version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /
    # lower bounds in pyproject.toml are deliberately loose (Python 3.10 support);
    # only propose a change when a new release falls outside the allowed range
    versioning-strategy: increase-if-necessary
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
