name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install "ruff>=0.5"
      - run: ruff check src tests scripts repro

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      # real-data tests skip themselves: the public datasets are not in the repo
      - run: python -m pytest -q -rs
      - name: demo smoke test
        run: python -m rootline.cli demo --outdir out --benign 200
      - name: real-capture smoke test (committed OTRF Log4Shell excerpt)
        run: python -m rootline.cli analyze tests/fixtures/log4shell_sysmon.json tests/fixtures/log4shell_auoms.json

  core-no-extras:
    # the engine itself must keep working with the standard library only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: python -m pytest -q -rs

  docker:
    # builds the image and checks the preloaded Log4Shell story is served
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rootline:ci .
      - run: docker run -d --name rl -p 127.0.0.1:8000:8000 rootline:ci
      - name: health and preloaded story
        run: |
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          curl -fs http://127.0.0.1:8000/api/stories | python3 -c "import json,sys; s=json.load(sys.stdin); assert s and s[0]['story_vertices'] > 0, s; print(s)"
      - if: failure()
        run: docker logs rl

  compose-neo4j:
    # docker-compose stack: UI up, and the Cypher export actually imports into Neo4j
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: random Neo4j password for this run
        run: echo "NEO4J_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
      - run: docker compose config -q && docker compose up -d --build
      - run: python -m rootline.cli analyze tests/fixtures/log4shell_sysmon.json tests/fixtures/log4shell_auoms.json --cypher story.cypher
      - name: wait for UI and Neo4j
        run: |
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:8000/api/health && break; sleep 2; done
          for i in $(seq 1 60); do docker compose exec -T neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" "RETURN 1" && break; sleep 3; done
      - name: import story and check it
        run: |
          docker compose exec -T neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" < story.cypher
          n=$(docker compose exec -T neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" --format plain "MATCH (n:Rootline) RETURN count(n)" | tail -1)
          echo "nodes: $n"; test "$n" -gt 0
          rc=$(docker compose exec -T neo4j cypher-shell -u neo4j -p "$NEO4J_PASSWORD" --format plain "MATCH (s:RootlineStory) RETURN size(s.root_causes)" | tail -1)
          echo "root causes: $rc"; test "$rc" -gt 0
      - if: failure()
        run: docker compose logs

  live-ebpf:
    # Runs the bpftrace probe LIVE (sudo) on the runner's real kernel while a benign,
    # attack-shaped chain runs inside the runner only (dummy interface + loopback), then
    # asserts ROOTLINE recovers the chain. Five independent runs measure repeatability.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        run: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: install bpftrace (package registry only)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bpftrace
          bpftrace --version
          uname -r
          ls -la /sys/kernel/btf/vmlinux
      - name: run probe + scripted chain (inside the runner only)
        run: OUT=live-out bash scripts/live/run_chain.sh
      - name: reconstruct and assert
        run: |
          python scripts/live/assert_chain.py live-out/capture.jsonl --out live-out/result.json             --probe-pid "$(cat live-out/probe.pid)" --chain live-out/chain.json --threads live-out/ps_threads.txt
      - name: capture excerpt (lines touching the chain)
        if: always()
        run: grep -E "rootline-lab|rl-home|198\.51\.100\.7|::1|kind=fork|kind=exit|bpftrace" live-out/capture.jsonl | head -4000 > live-out/capture_excerpt.jsonl || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: live-ebpf-${{ matrix.run }}
          path: live-out/
