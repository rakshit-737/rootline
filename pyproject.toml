[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rootline"
version = "1.1.0"
description = "Minimal provenance-graph attack reconstruction engine: eBPF/Sysmon/auditd telemetry to root cause and blast radius"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
stix = ["stix2>=3.0"]
bench = ["matplotlib>=3.7", "scikit-learn>=1.3"]
repro = ["torch>=2.2", "numpy>=1.24", "rapidfuzz>=3.0"]
dev = ["pytest>=7", "ruff>=0.5", "scikit-learn>=1.3", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "stix2>=3.0"]

[project.scripts]
rootline = "rootline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rootline = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded public datasets (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
