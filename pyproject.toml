[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rootline"
version = "1.1.0"
description = "Minimal provenance-graph attack reconstruction engine: eBPF/Sysmon/auditd telemetry to root cause and blast radius"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
api = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]
stix = ["stix2>=3.0"]
bench = ["matplotlib>=3.7", "scikit-learn>=1.3"]
repro = ["torch>=2.2", "numpy>=1.24", "rapidfuzz>=3.0"]
dev = ["pytest>=7", "ruff>=0.5", "scikit-learn>=1.3", "fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27", "stix2>=3.0"]

[project.scripts]
rootline = "rootline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
rootline = ["web/*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["realdata: needs the downloaded public datasets (skipped when absent)"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# D101-D103: every public class, method and function in src/ has a docstring
select = ["E", "F", "W", "I", "B", "D101", "D102", "D103"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The sources pinned in scripts/freeze_v03.json (the sealed-protocol record, docs/protocol.md)
# are not edited, not even for docstrings; tests, scripts and the paper reproduction are exempt.
"src/rootline/rules_v03.py" = ["D1"]
"src/rootline/rules_linux.py" = ["D1"]
"src/rootline/detect.py" = ["D1"]
"src/rootline/normalize.py" = ["D1"]
"src/rootline/models.py" = ["D1"]
"src/rootline/graph.py" = ["D1"]
"src/rootline/pipeline.py" = ["D1"]
"src/rootline/loaders/__init__.py" = ["D1"]
"src/rootline/loaders/sysmon.py" = ["D1"]
"src/rootline/loaders/auditd.py" = ["D1"]
"tests/**" = ["D1"]
"scripts/**" = ["D1"]
"repro/**" = ["D1"]
"docs/**" = ["D1"]
