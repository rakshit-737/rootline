site_name: ROOTLINE
site_description: Provenance-graph attack reconstruction from eBPF / Sysmon / auditd telemetry
site_url: https://rakshit-737.github.io/rootline-provenance-forensics/
repo_url: https://github.com/rakshit-737/rootline-provenance-forensics
repo_name: rakshit-737/rootline-provenance-forensics
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.snippets: {base_path: ["."], check_paths: true}
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            members_order: source
            docstring_style: google
            show_root_toc_entry: false
            show_if_no_docstring: true
            filters: ["!^_"]

hooks:
  - docs/hooks.py

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - How it works: how-it-works.md
  - Evaluation: evaluation.md
  - Reproduce: reproduce.md
  - Rule-evaluation protocol: protocol.md
  - Architecture: architecture.md
  - Datasets: datasets.md
  - Raw benchmark tables: benchmarks.md
  - Live demo: live-demo.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/api.md
      - HTTP API: reference/http.md
  - Threat model: threat-model.md
  - Security: security.md
  - ADRs:
      - 0001 Process-image vertices: adr/0001-process-image-vertices.md
      - 0002 Time-respecting traversal: adr/0002-time-respecting-traversal.md
      - 0003 Causality-preserving reduction: adr/0003-causality-preserving-reduction.md
      - 0004 Evaluation protocol: adr/0004-evaluation-protocol.md
      - 0005 Stdlib core, optional extras: adr/0005-stdlib-core-optional-extras.md
      - 0006 Multi-sensor fusion: adr/0006-multi-sensor-fusion.md
      - 0007 eBPF probe as reference (superseded): adr/0007-ebpf-probe-as-reference.md
      - 0008 Live bpftrace probe in CI: adr/0008-live-ebpf-in-ci.md
      - 0009 dev / dev2 / sealed rule protocol: adr/0009-sealed-rule-protocol.md
      - 0010 Ablation and held-out ATLAS hosts: adr/0010-ablation-and-heldout-atlas.md
  - Changelog: changelog.md
  - Limitations & roadmap: limitations.md
